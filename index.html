<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1A1A1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fut Shalom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA 1: Configuracao -->
  <div id="screen-setup" class="screen active">
    <h1>Fut Shalom</h1>

    <div class="config-grid">
      <div class="config-section">
        <label>Jogadores por time</label>
        <div class="number-control">
          <button onclick="adjustNumber('playersPerTeam', -1)">−</button>
          <span id="playersPerTeam">6</span>
          <button onclick="adjustNumber('playersPerTeam', 1)">+</button>
        </div>
      </div>

      <div class="config-section">
        <label>Tempo por jogo (min)</label>
        <div class="number-control">
          <button onclick="adjustNumber('gameTime', -1)">−</button>
          <span id="gameTime">7</span>
          <button onclick="adjustNumber('gameTime', 1)">+</button>
        </div>
      </div>

      <div class="config-section">
        <label>Gols por partida</label>
        <div class="number-control">
          <button onclick="adjustNumber('goalsPerMatch', -1)">−</button>
          <span id="goalsPerMatch">∞</span>
          <button onclick="adjustNumber('goalsPerMatch', 1)">+</button>
        </div>
      </div>

      <div class="config-section">
        <label>Jogos simultâneos</label>
        <div class="number-control">
          <button onclick="adjustNumber('numCourts', -1)">−</button>
          <span id="numCourts">1</span>
          <button onclick="adjustNumber('numCourts', 1)">+</button>
        </div>
      </div>
    </div>

    <div id="teamNamesSection" class="config-section"></div>

    <div class="config-section">
      <label>Adicionar jogador</label>
      <div class="player-input">
        <input type="text" id="playerName" placeholder="Nome do jogador" onkeydown="if(event.key==='Enter') addPlayer()">
        <button onclick="addPlayer()">+</button>
      </div>
    </div>

    <button class="btn-link" onclick="toggleBulkImport()">📋 Importar lista de nomes</button>

    <div id="bulkImportSection" class="config-section hidden">
      <label>Cole a lista (um nome por linha)</label>
      <textarea id="bulkImportText" class="bulk-textarea" rows="5" placeholder="João&#10;Maria&#10;Pedro&#10;Ana"></textarea>
      <button class="btn-primary btn-small" onclick="processBulkImport()">Adicionar todos</button>
    </div>

    <div class="player-list-header">
      <span id="playerCount"></span>
      <p class="star-tooltip">Toque no jogador para marcar como ⭐ estrela. Estrelas são distribuídas entre os times.</p>
    </div>
    <div id="playerList" class="player-list"></div>

    <label class="toggle-option">
      <input type="checkbox" id="prioritizeArrival" onchange="toggleArrivalPriority(this.checked)">
      <span>Priorizar ordem de chegada</span>
    </label>
    <div id="mixSliderSection" class="mix-slider-section hidden">
      <label>Mistura: <span id="mixValueLabel">70%</span></label>
      <input type="range" id="arrivalMixSlider" min="0" max="100" value="70"
        oninput="arrivalMixFactor = +this.value; document.getElementById('mixValueLabel').textContent = this.value + '%'; saveState()">
      <div class="mix-slider-labels"><span>Ordem pura</span><span>Aleatório</span></div>
    </div>

    <div id="setupError" class="error-msg"></div>
    <button class="btn-primary" onclick="startDraft()">Sortear Times</button>
    <button class="btn-danger" onclick="clearAll()">Limpar Tudo</button>
  </div>

  <!-- TELA 2: Times sorteados -->
  <div id="screen-teams" class="screen">
    <h1>Times Sorteados</h1>
    <div id="teamsDisplay" class="teams-display"></div>
    <div id="queueDisplay" class="queue-display"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="goBackToSetup()">Voltar</button>
      <button class="btn-primary" onclick="startMatch()">Iniciar Jogo</button>
    </div>
  </div>

  <!-- TELA 3: Jogo -->
  <div id="screen-match" class="screen">
    <div class="match-tabs">
      <button class="match-tab active" onclick="showMatchTab('game')">Jogo</button>
      <button class="match-tab" onclick="showMatchTab('history')">Histórico</button>
    </div>

    <div id="matchGameView">
      <div id="courtTabs" class="court-tabs hidden"></div>
      <div id="matchTeams" class="match-teams"></div>

      <div id="scoreSection" class="score-section">
        <div class="score-team">
          <span class="score-label" id="scoreLabelA">Time A</span>
          <div class="score-control">
            <button onclick="adjustGoals('A', -1)">−</button>
            <span id="goalsA" class="score-value">0</span>
            <button onclick="adjustGoals('A', 1)">+</button>
          </div>
        </div>
        <span class="score-x">×</span>
        <div class="score-team">
          <span class="score-label" id="scoreLabelB">Time B</span>
          <div class="score-control">
            <button onclick="adjustGoals('B', -1)">−</button>
            <span id="goalsB" class="score-value">0</span>
            <button onclick="adjustGoals('B', 1)">+</button>
          </div>
        </div>
      </div>

      <div class="timer-display">
        <span id="timer">07:00</span>
      </div>

      <div class="btn-row">
        <button id="btnTimer" class="btn-primary" onclick="toggleTimer()">Iniciar</button>
        <button class="btn-secondary" onclick="resetTimer()">Reiniciar</button>
      </div>

      <div id="resultSection" class="result-section">
        <h2>Resultado</h2>
        <div class="result-buttons">
          <button class="btn-result" id="btnTeamA" onclick="setResult('A')"></button>
          <button class="btn-result" id="btnDraw" onclick="setResult('draw')">Empate</button>
          <button class="btn-result" id="btnTeamB" onclick="setResult('B')"></button>
        </div>
      </div>

      <div id="matchQueue" class="match-queue"></div>

      <div id="inactiveSection" class="inactive-section hidden"></div>

      <div class="config-section add-to-queue">
        <label>Adicionar jogador na fila</label>
        <div class="player-input">
          <label class="star-toggle-inline"><input type="checkbox" id="queuePlayerStar"><span>⭐</span></label>
          <input type="text" id="queuePlayerName" placeholder="Nome do jogador" onkeydown="if(event.key==='Enter') addPlayerToQueue()">
          <button onclick="addPlayerToQueue()">+</button>
        </div>
      </div>

      <button class="btn-link" onclick="toggleMatchConfig()">⚙ Configurações</button>

      <div id="matchConfigSection" class="match-config hidden">
        <div class="config-section">
          <label>Jogadores por time</label>
          <div class="number-control">
            <button onclick="adjustMatchConfig('matchPlayersPerTeam', -1)">−</button>
            <span id="matchPlayersPerTeam">6</span>
            <button onclick="adjustMatchConfig('matchPlayersPerTeam', 1)">+</button>
          </div>
        </div>
        <div class="config-section">
          <label>Tempo por jogo (minutos)</label>
          <div class="number-control">
            <button onclick="adjustMatchConfig('matchGameTime', -1)">−</button>
            <span id="matchGameTime">7</span>
            <button onclick="adjustMatchConfig('matchGameTime', 1)">+</button>
          </div>
        </div>
        <div class="config-section">
          <label>Gols por partida</label>
          <div class="number-control">
            <button onclick="adjustMatchConfig('matchGoalsPerMatch', -1)">−</button>
            <span id="matchGoalsPerMatch">∞</span>
            <button onclick="adjustMatchConfig('matchGoalsPerMatch', 1)">+</button>
          </div>
        </div>
        <button class="btn-primary btn-small" onclick="applyMatchConfig()">Salvar</button>
      </div>

      <div id="courtManagement" class="court-management hidden">
        <button class="btn-link" onclick="addCourt()">➕ Adicionar Jogo</button>
        <button class="btn-link btn-link-danger" onclick="removeCourt()">➖ Remover Jogo</button>
      </div>

      <button class="btn-secondary btn-back-match" onclick="goBack()">Voltar ao Sorteio</button>
    </div>

    <div id="matchHistoryView" class="hidden"></div>
  </div>

  <!-- Modal: Player Action (long-press) -->
  <div id="playerActionModal" class="modal-overlay hidden" onclick="if(event.target===this) closePlayerActionModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="playerActionTitle"></h3>
        <button class="modal-close" onclick="closePlayerActionModal()">&times;</button>
      </div>
      <div id="playerActionList" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal: Result Confirmation -->
  <div id="resultConfirmModal" class="modal-overlay hidden" onclick="if(event.target===this) cancelResult()">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Confirmar Resultado</h3>
        <button class="modal-close" onclick="cancelResult()">&times;</button>
      </div>
      <div id="resultConfirmBody" class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-secondary btn-small" onclick="cancelResult()">Cancelar</button>
        <button class="btn-primary btn-small" onclick="confirmResult()">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/config.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/match.js"></script>
</body>
</html>
